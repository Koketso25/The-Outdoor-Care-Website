<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Login Page CSS.css">
    <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <title>Log In Page</title>
</head>
<body>

<div class="login-form-container">
    <h1>Log In</h1>
    <form id="login-form" action="Quest 1.html" method="POST">
        <div class="form-group">
            <label for="name">Username:</label>
            <input type="text" id="name" name="name" placeholder="Username/Email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="pwd" placeholder="Password" required>
        </div>
        <div class="form-group">
            <button type="submit">Submit</button>
        </div>
        <div>
            <p class="signup-link">Don't have an account? <a href="Sign Up.html">Sign Up</a></p>
        </div>
        <br>

        <div class="social-login">
           <a href="#" class="btn btn-google">
            <i class="fab fa-google"></i>
           </a>
           <a href="#" class="btn btn-facebook">
            <i class="fab fa-facebook"></i> 
           </a>
           <a href="#" class="btn btn-gmail">
            <i class="fab fa-gmail"></i>
           </a>
           <a href="#" class="btn btn-github">
            <i class="fab fa-github"></i>
           </a>
    </form>
</div>
    
</body>
</html>
